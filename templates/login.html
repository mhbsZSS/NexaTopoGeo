<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexaTopoGeo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #2E472D;
            --cor-primaria-hover: #243823;
            --cor-primaria-clara: #EAF0EA;
            --cor-fundo: #F8F9FA;
            --cor-card: #FFFFFF;
            --cor-texto: #333333;
            --cor-texto-suave: #666666;
            --cor-borda: #E2E8F0;
            --sombra-card: 0 10px 30px rgba(46, 71, 45, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-header a {
            text-decoration: none;
            color: var(--cor-primaria);
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-header p {
            color: var(--cor-texto-suave);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .card {
            background: var(--cor-card);
            border: 1px solid var(--cor-borda);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: var(--sombra-card);
        }

        .card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--cor-primaria);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--cor-texto);
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--cor-borda);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--cor-texto);
            background-color: #FAFAFA;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--cor-primaria);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(46, 71, 45, 0.15);
        }

        .form-extras {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.5rem;
        }

        .link-text {
            color: var(--cor-primaria);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: color 0.2s;
            cursor: pointer;
        }

        .link-text:hover {
            color: var(--cor-primaria-hover);
            text-decoration: underline;
        }

        button.btn-primary {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--cor-primaria);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.btn-primary:hover {
            background-color: var(--cor-primaria-hover);
            transform: translateY(-1px);
        }

        .divider {
            height: 1px;
            background-color: var(--cor-borda);
            margin: 1.75rem 0;
        }

        .card-footer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--cor-texto-suave);
        }

        .card-footer a {
            color: var(--cor-primaria);
            font-weight: 600;
            text-decoration: none;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        /* Caixa de Recuperação de Senha */
        #recuperar-box {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--cor-borda);
        }

        #recuperar-box h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--cor-primaria);
            margin-bottom: 0.5rem;
        }

        #recuperar-box p {
            font-size: 0.85rem;
            color: var(--cor-texto-suave);
            margin-bottom: 1rem;
        }

        /* Notificação Toast */
        #notificacao {
            display: none;
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            min-width: 320px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="notificacao"></div>

    <div class="login-wrapper">
        <div class="brand-header">
            <a href="/">NexaTopoGeo</a>
            <p>Plataforma para Topografia e Agrimensura</p>
        </div>

        <div class="card">
            <h2>Acessar Plataforma</h2>

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="email">E-mail Corporativo</label>
                    <input type="email" id="email" name="email" placeholder="seu.nome@empresa.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>

                <div class="form-extras">
                    <a href="javascript:void(0)" onclick="alternarRecuperacao()" class="link-text">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <!-- Seção retrátil de esqueci minha senha -->
            <div id="recuperar-box">
                <h3>Recuperar Senha</h3>
                <p>Insira seu e-mail cadastrado para receber as instruções de recuperação.</p>
                <form action="/esqueci-senha" method="POST">
                    <div class="form-group">
                        <input type="email" name="email" placeholder="Seu e-mail cadastrado" required>
                    </div>
                    <button type="submit" class="btn-primary" style="background-color: #4A5568;">Enviar Link de Recuperação</button>
                </form>
            </div>

            <div class="divider"></div>

            <div class="card-footer">
                Ainda não tem conta? <a href="/cadastrar">Cadastre-se</a>
            </div>
        </div>
    </div>

    <script>
        function alternarRecuperacao() {
            const box = document.getElementById('recuperar-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('msg');
        const box = document.getElementById('notificacao');

        if (msg) {
            box.style.display = 'block';

            if (msg === 'cadastro_sucesso') {
                box.style.backgroundColor = '#2E472D';
                box.style.color = '#FFFFFF';
                box.innerHTML = 'Conta criada com sucesso! Faça login para continuar.';
            } else if (msg === 'email_enviado') {
                box.style.backgroundColor = '#2B6CB0';
                box.style.color = '#FFFFFF';
                box.innerHTML = 'Link de recuperação enviado caso o e-mail exista.';
            } else if (msg === 'senha_alterada') {
                box.style.backgroundColor = '#2E472D';
                box.style.color = '#FFFFFF';
                box.innerHTML = 'Senha redefinida com sucesso! Faça login com a nova senha.';
            } else if (msg === 'erro_login') {
                box.style.backgroundColor = '#C53030';
                box.style.color = '#FFFFFF';
                box.innerHTML = 'E-mail ou senha inválidos. Tente novamente.';
            } else if (msg === 'token_invalido') {
                box.style.backgroundColor = '#C53030';
                box.style.color = '#FFFFFF';
                box.innerHTML = 'Link de redefinição expirado ou inválido.';
            } else if (msg === 'erro_offline') {
                box.style.backgroundColor = '#D69E2E';
                box.style.color = '#000000';
                box.innerHTML = 'Serviço de autenticação temporariamente indisponível.';
            }

            setTimeout(() => {
                box.style.display = 'none';
            }, 6000);
        }
    </script>
</body>
</html>
